name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Fired by portfolio-backend after a successful admin save (see its
  # internal/service/dispatch_service.go) — rebuilds with fresh data
  # without a code push. This is the other half of the rebuild-on-save
  # architecture described in portfolio-frontend-context.md.
  repository_dispatch:
    types: [content-updated]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # Runs scripts/fetch-data.mjs (fresh data from the live API) before
        # `react-router build` — see package.json's "build" script.
        run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }} # Settings → Secrets and variables → Actions → Variables

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # react-router build (SPA mode) outputs here, not ./dist
          path: "./build/client"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
